<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TDX PvP Draft</title>
  <meta name="viewport" content="width=1920">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Тонкая верхняя полоса: только самое нужное -->
    <header class="topbar">
      <div class="topbar-title">TDX · PvP Draft</div>
      <!-- Переключатель режимов. Auction Draft — заглушка (ничего не делает, режим добавим позже) -->
      <nav class="mode-switch">
        <button class="mode-btn mode-btn--active" data-mode="wheel">Wheel Draft</button>
        <button class="mode-btn" data-mode="auction" title="Скоро">Auction Draft</button>
      </nav>
      <div class="topbar-status" id="topbar-status"></div>
      <button class="btn btn--ghost btn--small" id="btn-reset">Сбросить драфт</button>
    </header>

    <!-- Две равные половины: Blue слева, Red справа (создаются из шаблона в app.js) -->
    <main class="workspace" id="workspace"></main>
  </div>

  <!-- Шаблон одной половины (одинаковый для Blue и Red) -->
  <template id="half-template">
    <section class="half">
      <header class="half-header">
        <h2 class="team-name"></h2>
        <span class="seat-status"></span>
        <div class="half-header-actions">
          <button class="btn btn--claim"></button>
          <button class="btn btn--ghost btn--leave">Освободить</button>
        </div>
      </header>

      <div class="wheel-wrap">
        <canvas class="wheel-canvas"></canvas>
        <div class="wheel-caption wheel-caption--left"></div>
        <div class="wheel-caption wheel-caption--right"></div>
        <button class="btn btn--spin">ВРАЩАТЬ</button>
      </div>

      <div class="block">
        <div class="block-title"><span>Пул башен</span><span class="pool-count"></span></div>
        <div class="pool"></div>
      </div>

      <div class="block">
        <div class="block-title"><span>Итоговая колода</span><span class="deck-count"></span></div>
        <div class="deck"></div>
      </div>

      <div class="actions"></div>
    </section>
  </template>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="towers.js"></script>
  <script src="wheel-logic.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="net.js"></script>
  <script src="app.js"></script>
</body>
</html>
